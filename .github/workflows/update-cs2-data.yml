name: Update CS2 Item Data

on:
  schedule:
    # Run every Friday at 06:00 UTC
    - cron: '0 6 * * 5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Update CS2 item backup files
        id: update
        run: node scripts/update-cs2-data.mjs

      - name: Create PR with changes
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-cs2-data-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/main/helpers/classes/steam/items/itemsBackupFiles/items_game.json
          git add src/main/helpers/classes/steam/items/itemsBackupFiles/csgo_english.json
          git commit -m "chore: update CS2 item data backups"
          git push --force origin "$BRANCH"
          gh pr create \
            --title "chore: update CS2 item data backups" \
            --body "Automated update of \`items_game.json\` and \`csgo_english.json\` from [SteamTracking/GameTracking-CS2](https://github.com/SteamTracking/GameTracking-CS2)." \
            --base main \
            --head "$BRANCH" \
            --label "dependencies" \
            || gh pr edit "$BRANCH" \
              --title "chore: update CS2 item data backups" \
              --body "Automated update of \`items_game.json\` and \`csgo_english.json\` from [SteamTracking/GameTracking-CS2](https://github.com/SteamTracking/GameTracking-CS2)."
