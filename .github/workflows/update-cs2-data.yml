name: Update CS2 Item Data

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: '0 * * * 5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Update CS2 item backup files
        id: update
        run: node scripts/update-cs2-data.mjs

      - name: Create PR with changes
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-cs2-data"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/main/helpers/classes/steam/items/itemsBackupFiles/items_game.json
          git add src/main/helpers/classes/steam/items/itemsBackupFiles/csgo_english.json
          git commit -m "chore: update CS2 item data backups"
          git push --force origin "$BRANCH"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Reusing existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" \
              --title "chore: update CS2 item data backups" \
              --body "Automated update of \`items_game.json\` and \`csgo_english.json\` from [SteamTracking/GameTracking-CS2](https://github.com/SteamTracking/GameTracking-CS2)."
          else
            gh pr create \
              --title "chore: update CS2 item data backups" \
              --body "Automated update of \`items_game.json\` and \`csgo_english.json\` from [SteamTracking/GameTracking-CS2](https://github.com/SteamTracking/GameTracking-CS2)." \
              --base main \
              --head "$BRANCH" \
              --label "dependencies"
          fi
