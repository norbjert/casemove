name: Unit Tests

on:
  workflow_call:

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm install --ignore-scripts

      - run: npm test
