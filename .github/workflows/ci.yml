name: CI

on:
  pull_request:
  push:
    branches: [main, master]

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
