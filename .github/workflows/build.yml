name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm install --ignore-scripts

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: out/
