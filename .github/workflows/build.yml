name: Build

on:
  workflow_call:

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm install --ignore-scripts

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: out/
