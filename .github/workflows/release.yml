name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true
      linux:
        description: 'Build Linux (AppImage, .deb and AUR)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows (NSIS + Portable)'
        type: boolean
        default: true
      mac:
        description: 'Build macOS (DMG)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  set_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set version in package.json
        id: set_version
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "Setting version to $VERSION in package.json..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update package.json
          npm version $VERSION --no-git-tag-version

          # Commit updated package.json
          git add package.json
          git commit -m "chore: bump version to $VERSION"
          git push origin HEAD

          # Create Git tag
          git tag v$VERSION
          git push origin v$VERSION

          echo "::set-output name=version::$VERSION"

  linux:
    if: ${{ github.event.inputs.linux }}
    needs: set_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --linux --publish always

  windows:
    if: ${{ github.event.inputs.windows }}
    needs: set_version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: Remove-Item package-lock.json
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish (installer)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --win nsis --publish always
      - name: Package and publish (portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --win portable --publish always

  mac:
    if: ${{ github.event.inputs.mac }}
    needs: set_version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --mac --publish always

  release_notes:
    needs: [linux, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh jq -y
      - name: Authenticate GitHub CLI
        run: gh auth setup-git
      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "Generating release notes for version $VERSION..."

          # Get last tag before this one
          LAST_TAG=$(git describe --tags --abbrev=0 v$VERSION^ || echo "")
          echo "Last tag: $LAST_TAG"

          # Fetch PRs merged since last tag
          if [ -z "$LAST_TAG" ]; then
            PRS=$(gh pr list --state merged --json number,title,labels,url)
          else
            PRS=$(gh pr list --state merged --json number,title,labels,url --search "merged:>$LAST_TAG")
          fi

          # Parse PRs into sections
          NEW_FEATURES=""
          BUG_FIXES=""
          echo "$PRS" | jq -c '.[]' | while read pr; do
            TITLE=$(echo $pr | jq -r '.title')
            URL=$(echo $pr | jq -r '.url')
            LABELS=$(echo $pr | jq -r '.labels[].name' 2>/dev/null || "")

            if echo "$LABELS" | grep -Eiq 'feature|enhancement'; then
              NEW_FEATURES="$NEW_FEATURES- [$TITLE]($URL)\n"
            else
              BUG_FIXES="$BUG_FIXES- [$TITLE]($URL)\n"
            fi
          done

          NOTES="## New Features\n\n$NEW_FEATURES\n## Bug Fixes and Version Bumps\n\n$BUG_FIXES"
          echo -e "$NOTES" > release_notes.md

          # Create GitHub release
          gh release create v$VERSION --title "Casemove $VERSION" --notes-file release_notes.md
