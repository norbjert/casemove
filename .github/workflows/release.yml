  mac:
    if: ${{ inputs.mac }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --mac --publish always

  release_notes:
    needs: [linux, windows, mac]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate and publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Find the previous release (excluding the one we just published)
          PREV_TAG=$(gh release list \
            --repo "$REPO" \
            --limit 20 \
            --json tagName,isPrerelease \
            | jq -r --arg cur "v$VERSION" \
            '[.[] | select(.tagName != $cur and .isPrerelease == false)] | .[0].tagName // ""')

          if [ -n "$PREV_TAG" ]; then
            echo "Previous release: $PREV_TAG"
            SINCE=$(gh release view "$PREV_TAG" \
              --repo "$REPO" \
              --json publishedAt \
              --jq '.publishedAt')
          else
            echo "No previous release found — including all merged PRs"
            SINCE="2000-01-01T00:00:00Z"
          fi

          echo "Collecting PRs merged after: $SINCE"

          # Fetch all merged PRs since the previous release
          PRS=$(gh pr list \
            --repo "$REPO" \
            --state merged \
            --search "merged:>${SINCE}" \
            --json number,title,labels \
            --limit 200)

          FEATURES=""
          BUGFIXES=""
          DEPS=""

          while IFS= read -r pr; do
            NUMBER=$(echo "$pr" | jq -r '.number')
            TITLE=$(echo "$pr"  | jq -r '.title')
            LABELS=$(echo "$pr" | jq -r '[.labels[].name] | join(" ")')

            LINE="- $TITLE (#$NUMBER)"

            if echo "$LABELS" | grep -qiE "(^| )dependencies( |$)"; then
              DEPS="${DEPS}"$'\n'"${LINE}"
            elif echo "$LABELS" | grep -qiE "(^| )(bug|fix|refactor)"; then
              BUGFIXES="${BUGFIXES}"$'\n'"${LINE}"
            else
              FEATURES="${FEATURES}"$'\n'"${LINE}"
            fi
          done < <(echo "$PRS" | jq -c '.[]')

          # Build the release notes body
          BODY="## What's new in v${VERSION}"$'\n'

          if [ -n "$FEATURES" ]; then
            BODY="${BODY}"$'\n'"### Features"$'\n'"${FEATURES}"$'\n'
          fi

          if [ -n "$BUGFIXES" ]; then
            BODY="${BODY}"$'\n'"### Bug fixes & refactoring"$'\n'"${BUGFIXES}"$'\n'
          fi

          if [ -n "$DEPS" ]; then
            BODY="${BODY}"$'\n'"### Dependency updates"$'\n'"${DEPS}"$'\n'
          fi

          if [ -z "$FEATURES" ] && [ -z "$BUGFIXES" ] && [ -z "$DEPS" ]; then
            BODY="${BODY}"$'\n'"No merged pull requests found since the previous release."$'\n'
          fi

          echo "--- Release notes ---"
          echo "$BODY"

          # Update the release (created by electron-builder) with the generated notes
          gh release edit "v${VERSION}" \
            --repo "$REPO" \
            --notes "$BODY"

          echo "Release notes published for v${VERSION}"
