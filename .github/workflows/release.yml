name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true
      linux:
        description: 'Build Linux (AppImage)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows (NSIS)'
        type: boolean
        default: false
      mac:
        description: 'Build macOS (DMG)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  linux:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --linux --publish always

  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version
      - run: Remove-Item package-lock.json
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --win --publish always

  aur:
    if: ${{ inputs.linux }}
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compute checksums and update PKGBUILD
        run: |
          APPIMAGE_SHA=$(curl -sL "https://github.com/norbjert/casemove/releases/download/v${{ inputs.version }}/Casemove.AppImage" | sha256sum | awk '{print $1}')
          ICON_SHA=$(curl -sL "https://raw.githubusercontent.com/norbjert/casemove/v${{ inputs.version }}/assets/icon.png" | sha256sum | awk '{print $1}')
          sed -i "s/pkgver=.*/pkgver=${{ inputs.version }}/" aur/PKGBUILD
          sed -i "s/APPIMAGE_SHA256/${APPIMAGE_SHA}/" aur/PKGBUILD
          sed -i "s/ICON_SHA256/${ICON_SHA}/" aur/PKGBUILD
      - uses: nickelc/publish-aur-action@v2
        with:
          pkgname: casemove-bin
          pkgbuild: ./aur/PKGBUILD
          commit_username: norbjert
          commit_email: norbjert@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  mac:
    if: ${{ inputs.mac }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --mac --publish always
