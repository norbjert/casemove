name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true
      linux:
        description: 'Build Linux (AppImage)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows (NSIS)'
        type: boolean
        default: false
      mac:
        description: 'Build macOS (DMG)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  linux:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --linux --publish always

  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --win --publish always

  mac:
    if: ${{ inputs.mac }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --mac --publish always
