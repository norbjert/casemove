name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true
      linux:
        description: 'Build Linux (AppImage)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows (NSIS)'
        type: boolean
        default: false
      mac:
        description: 'Build macOS (DMG)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            release/app/package-lock.json
      - name: Set version
        shell: bash
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          cd release/app && npm version ${{ inputs.version }} --no-git-tag-version
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: cd release/app && npm install --legacy-peer-deps --ignore-scripts
      - name: Install native deps
        env:
          npm_config_ignore_scripts: true
        run: ./node_modules/.bin/electron-builder install-app-deps
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --linux --publish always

  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            release/app/package-lock.json
      - name: Set version
        shell: bash
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          cd release/app && npm version ${{ inputs.version }} --no-git-tag-version
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: cd release/app && npm install --legacy-peer-deps --ignore-scripts
      - name: Install native deps
        env:
          npm_config_ignore_scripts: true
        run: ./node_modules/.bin/electron-builder install-app-deps
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --win --publish always

  mac:
    if: ${{ inputs.mac }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            release/app/package-lock.json
      - name: Set version
        shell: bash
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          cd release/app && npm version ${{ inputs.version }} --no-git-tag-version
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: cd release/app && npm install --legacy-peer-deps --ignore-scripts
      - name: Install native deps
        env:
          npm_config_ignore_scripts: true
        run: ./node_modules/.bin/electron-builder install-app-deps
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --mac --publish always
