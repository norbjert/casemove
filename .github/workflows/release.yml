name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.3.4)'
        required: true

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            package-lock.json
            release/app/package-lock.json

      - name: Set version
        shell: bash
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          cd release/app && npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Install root dependencies
        run: npm install

      - name: Install app dependencies
        run: cd release/app && npm install

      - name: Build
        run: npm run build

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --${{ matrix.platform }} --publish always
