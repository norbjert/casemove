name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true
      linux:
        description: 'Build Linux (AppImage, .deb and AUR)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows (NSIS + Portable)'
        type: boolean
        default: true
      mac:
        description: 'Build macOS (DMG)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  linux:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --linux --publish always

  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - run: Remove-Item package-lock.json
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Package and publish (installer)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --win nsis --publish always

      - name: Package and publish (portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ./node_modules/.bin/electron-builder build --win portable --publish always

