version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "typescript"
        versions: [">=5.0.0"]
      - dependency-name: "chalk"
        versions: [">=5.0.0"]
      - dependency-name: "react-chartjs-2"
        versions: [">=5.0.0"]
      - dependency-name: "rimraf"
        versions: [">=4.0.0"]
      - dependency-name: "react-redux"
        versions: [">=9.0.0"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6.0.0"]
      - dependency-name: "react"
        versions: [">=19.0.0"]
      - dependency-name: "react-dom"
        versions: [">=19.0.0"]
      - dependency-name: "@types/react"
        versions: [">=19.0.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.0.0"]

  - package-ecosystem: "npm"
    directory: "/release/app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
